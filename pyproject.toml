[project]
name = "x-search-cli"
version = "0.1.0"
description = "Practical CLI wrapper for Hermes x_search_tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "hermes-agent",
]

[project.scripts]
x-search = "x_search_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["x_search_cli"]
